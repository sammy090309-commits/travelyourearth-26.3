# Main metadata
license = "${mod_license}"
issueTrackerURL = "https://github.com/sammy090309-commits/travelyourearth-26.3/issues"

# Mod
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
iconFile = "icon.png"
bannerFile = "banner.png"
authors = "Sam_MC123"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/travel-your-earth"

description ='''
A mod that expands the content of the discontinued Minecraft Earth game in a vanilla and user-friendly way.
'''

# Mixins
[[mixins]]
config = "${mod_id}.mixins.json"

# Dependencies
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
# Load AFTER NeoForge so our vanilla armor item definitions (with the ruby trim)
# take priority over NeoForge's resources.
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"