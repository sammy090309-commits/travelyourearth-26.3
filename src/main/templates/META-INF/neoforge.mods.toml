# Metadata principal
license = "${mod_license}"
issueTrackerURL = "https://github.com/sammy090309-commits/travelyourearth-26.2-V1"

# Configuración del Mod
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
iconFile = "icon.png"
bannerFile = "banner.png"
authors = "Sam_MC123"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/travel-your-earth"

description ='''
A mod that expands the content of the discontinued Minecraft Earth game in a vanilla and user-friendly way.
'''

# Mixins
[[mixins]]
config = "${mod_id}.mixins.json"

# Dependencias
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
# CAMBIO: cargar DESPUÉS de NeoForge para que nuestras definiciones de armaduras
# vanilla (con el trim de rubí) tengan prioridad sobre las de NeoForge,
# que en la 26.3 beta no dibujan trims (TODO 26.3 en su TrimmedArmorModel).
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
